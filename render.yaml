# Despliegue en Render (Blueprint). Las claves de Supabase se cargan en el panel de Render, nunca aquí.
services:
  - type: web
    name: data-cleaner
    runtime: python
    plan: free
    rootDir: data-cleaner-app
    buildCommand: pip install -r requirements.txt
    # Render atiende el HTTPS en su proxy: con --forwarded-allow-ips la app ve "https",
    # marca las cookies como secure y arma bien las URLs de regreso del login.
    # Un solo proceso, porque las sesiones viven en memoria.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
